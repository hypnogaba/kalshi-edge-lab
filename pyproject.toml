[project]
name = "kalshi-edge-lab"
version = "0.0.1"
description = "Decode and benchmark the DoubleZero edge multicast feed of Kalshi crypto perpetuals"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "websockets>=13.0",
    "cryptography>=43.0",
    "orjson>=3.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "uvloop>=0.20; sys_platform != 'win32'",
    "rich>=13",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "sources"]
